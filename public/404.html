<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>coed</title>
  <script>
    // Omdirigerar sub-paths till SPA-rooten på GitHub Pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?r=' + encodeURIComponent(l.pathname.slice(1) + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
